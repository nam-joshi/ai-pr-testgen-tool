name: AI PR TestGen

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install

    - name: Load GitHub Secrets into Environment
      run: |
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
        echo "PAT_TOKEN=${{ secrets.PAT_TOKEN }}" >> $GITHUB_ENV
        echo "REPO_OWNER=${{ secrets.REPO_OWNER }}" >> $GITHUB_ENV
        echo "REPO_NAME=${{ secrets.REPO_NAME }}" >> $GITHUB_ENV

    - name: Fetch PR Files
      run: npm run get-pr

    - name: Analyze PR with OpenAI
      run: npm run analyze-pr

    - name: Post PR Comment with Results
      run: |
        node << 'EOF'
        
        const fs = require("fs");
        const path = require("path");
        const { Octokit } = require("@octokit/rest");

        const resultPath = path.join(process.cwd(), "data", "pr-ai-suggestions.json");

        if (!fs.existsSync(resultPath)) {
        console.error("❌ No AI suggestions file found.");
        process.exit(1);
        }

        const data = JSON.parse(fs.readFileSync(resultPath, "utf8"));
        const pr = data[0];
        const s = pr.suggestions;

        const body = `
        🧪 **AI TestGen Suggestions**

        ### 🔥 Smoke Tests
        ${s.smoke.map(t => `- ${t}`).join("\n")}

        ### ❌ Negative Tests
        ${s.negative.map(t => `- ${t}`).join("\n")}

        ### ⚠️ Edge Case Tests
        ${s.edge.map(t => `- ${t}`).join("\n")}
        `;

        const octokit = new Octokit({ auth: process.env.PAT_TOKEN });

        octokit.issues.createComment({
        owner: process.env.REPO_OWNER,
        repo: process.env.REPO_NAME,
        issue_number: pr.pr_number,
        body
        }).then(() => {
        console.log("✔️ Posted AI TestGen comment to PR!");
        }).catch(err => {
        console.error("❌ Failed to post comment:", err);
        process.exit(1);
        });

        EOF
