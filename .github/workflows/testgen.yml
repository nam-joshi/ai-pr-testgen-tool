name: AI PR TestGen

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install

    - name: Load GitHub Secrets into Environment
      run: |
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
        echo "PAT_TOKEN=${{ secrets.PAT_TOKEN }}" >> $GITHUB_ENV
        echo "REPO_OWNER=${{ secrets.REPO_OWNER }}" >> $GITHUB_ENV
        echo "REPO_NAME=${{ secrets.REPO_NAME }}" >> $GITHUB_ENV

    - name: Fetch PR Files
      run: npm run get-pr

    - name: Analyze PR with OpenAI
      run: npm run analyze-pr

    - name: Post PR Comment with Results
      run: node scripts/post-comment.js
